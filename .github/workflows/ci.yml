# SPDX-License-Identifier: MIT

# Builds gsf whenever main changes: on Windows x64 with clang-cl, and on macOS ARM64. The Windows job runs ctest too.
# The macOS job builds the Release configuration without the tests (GSF_TESTS=OFF). Changes to documentation alone
# don't start a run.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitattributes", ".gitignore", ".clang-format"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push waits for the run before it. A run that has started is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (clang-cl)
            os: windows-2025
            cmake: -A x64 -T ClangCL
          - name: macOS ARM64 (Apple Clang)
            os: macos-15
            cmake: -DGSF_TESTS=OFF
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./externals/xsflib/ci/build-and-test
        with:
          cmake: ${{ matrix.cmake }}
          test-timeout: 600
